name: AntiBestFriend CI

on:
  push:
    branches: [ main, "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Parity & Policy Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Skills Parity Verification
        run: python3 tests/test_skills_parity.py

      - name: Run MCP Policy & Foreign Ownership Tests
        run: python3 tests/test_mcp_policy.py

      - name: Run Design Intelligence Functional Tests
        run: python3 tests/test_design_intelligence_functional.py

  test-shell-and-topology:
    name: Shell, Residue & Wrapper Hardening Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Residue & Cleanliness Gate
        run: ./tests/test_residue_gate.sh

      - name: Run Self-Contained Runtime Test
        run: ./tests/test_self_contained_runtime.sh

      - name: Run YOLO Wrapper Tests
        run: ./tests/test_yolo_wrapper.sh

      - name: Run Isolated HOME Installation Test
        run: ./tests/test_isolated_home.sh

      - name: Run Idempotency Test
        run: ./tests/test_idempotency.sh

      - name: Run Transactional Fault Injection Test
        run: ./tests/test_fault_injection.sh
